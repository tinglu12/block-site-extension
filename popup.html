<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simple Site Blocker</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <p id="status" class="status">&nbsp;</p>
    <p id="site" class="site">&nbsp;</p>
    <button id="action" type="button" disabled>Loading…</button>
    <p id="error" class="error" hidden></p>
    <button id="manage" type="button" class="link">Manage blocked sites</button>
  </main>
</body>
</html>
