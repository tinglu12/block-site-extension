<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked sites</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="list.css">
  <script type="module" src="list.js"></script>
</head>
<body>
  <main class="page">
    <header>
      <img src="icons/icon48.png" alt="" width="32" height="32">
      <h1>Blocked sites</h1>
    </header>

    <form id="add-form" class="add" novalidate>
      <input id="add-input" type="text" placeholder="Add a site, e.g. youtube.com"
             aria-label="Site to block" autocomplete="off" spellcheck="false">
      <button type="submit" class="block">Block</button>
    </form>
    <p id="add-message" class="error" hidden></p>

    <p id="empty" class="empty" hidden>No sites blocked yet.</p>
    <ul id="list" class="list"></ul>
  </main>
</body>
</html>
